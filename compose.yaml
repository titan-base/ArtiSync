services:
  app:
    build:
      context: .
      dockerfile: DockerFile.dev
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: env.POSTGRES_USER
      POSTGRES_PASSWORD: env.POSTGRES_PASSWORD
      POSTGRES_DB: env.POSTGRES_DB
    ports:
      - "5432:5432"

