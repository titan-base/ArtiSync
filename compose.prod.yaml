name: artisync-prod

services:
  app:
    # 本番用 Dockerfile でアプリをイメージに含めるので、ソースのマウントは不要。
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # 利用する OAuth プロバイダーの ID とシークレットを設定する。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # ホスト自身の 127.0.0.1:3000 に届いた通信を、コンテナの 3000 番に転送する。
    ports:
      - "127.0.0.1:3000:3000"
    # ログイン状態に依存しない /api/health が HTTP 200 を返すことを確認する。
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - |
          const response = await fetch('http://127.0.0.1:3000/api/health', { redirect: 'manual' });
          process.exit(response.status === 200 ? 0 : 1);
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # プロセス終了時に自動再起動する。ヘルスチェックの失敗だけでは再起動しない。
    restart: unless-stopped

  # PostgreSQL が接続を受け付けてから SQL を適用する。失敗時はアプリの起動を止める。
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  db:
    image: postgres:15
    # 初回の DB 初期化に使う値。未設定または空の項目があれば Compose がエラーを返す。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # DB コンテナを作り直してもデータを保持できるよう、名前付きボリュームに保存する。
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL が接続を受け付けるか確認する。$$ で環境変数の展開をコンテナ側に任せる。
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
